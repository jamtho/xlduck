<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://a.tile.openstreetmap.org https://b.tile.openstreetmap.org https://c.tile.openstreetmap.org https://server.arcgisonline.com; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>XLDuck Preview</title>
    <link rel="stylesheet" href="preview.css">
    <!-- Integrity-pinned libraries distributed with the add-in. -->
    <script src="vega.min.js"></script>
    <script src="vega-interpreter.min.js"></script>
    <script src="vega-lite.min.js"></script>
    <script src="vega-embed.min.js"></script>
    <!-- Leaflet for map template -->
    <link rel="stylesheet" href="leaflet.css" />
    <script src="leaflet.js"></script>
    <!-- SQL formatter (UMD build for browser global) -->
    <script src="sql-formatter.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title" id="title">XLDuck Preview</div>
            <div class="handle" id="handle"></div>
        </div>
        <div class="content" id="content">
            <div class="empty-state">Select a cell containing a handle to preview</div>
        </div>
    </div>

    <script src="preview.js"></script>
</body>
</html>
