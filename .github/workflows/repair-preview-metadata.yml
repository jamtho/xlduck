name: Repair preview download metadata
on:
  push:
    branches: [codex/modernization-foundation]
    paths: [.github/workflows/repair-preview-metadata.yml]
permissions:
  contents: write
jobs:
  checksums:
    runs-on: ubuntu-latest
    steps:
      - name: Match checksums to the filenames actually published by GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir downloads
          gh release download v0.2.0-preview.1 --repo jamtho/xlduck --dir downloads --pattern '*.zip' --pattern '*.xlsx' --pattern build-info.json
          test "$(jq -r .sourceCommit downloads/build-info.json)" = 9674b652cf2ad069a7d009f35db2f479501591f4
          jq -e '.trackedChanges == false and .untrackedFilesPresent == false' downloads/build-info.json
          cd downloads
          test -f XlDuck.Research.Demo.xlsx
          test -f xlduck-0.2.0-preview.1-windows-x64.zip
          test -f xlduck-skill.zip
          sha256sum -- * > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          gh release upload v0.2.0-preview.1 SHA256SUMS.txt --repo jamtho/xlduck --clobber
