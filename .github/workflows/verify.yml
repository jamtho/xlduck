name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core-and-preview:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      DOTNET_ROLL_FORWARD: LatestMajor
      XLDUCK_TEST_BROWSER: chromium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '11.25.0'
      - name: Acquire verified build dependencies
        shell: powershell
        run: |
          ./scripts/Get-ReaderExtensions.ps1
          ./scripts/Get-PreviewAssets.ps1
      - name: Core, host, engine, worker and read policy
        shell: powershell
        run: ./tests/Run-CoreTests.ps1 -WithReaders
      - name: Install browser test dependencies
        working-directory: tests/preview
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec playwright install chromium
      - name: Preview correctness and offline charts
        run: node tests/preview/preview.test.cjs
      - name: Read-only agent polling helper
        run: node tests/agent-exploration.test.cjs
      - name: Build an unsigned package and check its manifest
        shell: powershell
        run: |
          ./scripts/Build-Package.ps1 -Destination artifacts/ci-package
          ./scripts/Verify-Package.ps1 -Directory artifacts/ci-package
      - name: Package failure and diagnostics regressions (no Excel)
        shell: powershell
        run: ./tests/Test-Package.ps1 -PackageDirectory artifacts/ci-package
      - name: Installation lifecycle and bootstrap skill (isolated files and registry)
        shell: powershell
        run: ./tests/Test-Setup.ps1 -PackageDirectory artifacts/ci-package
      # Native Excel and live provider checks run separately on an owned workstation.
      - name: Prepare verified downloads
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          New-Item -ItemType Directory artifacts/downloads | Out-Null
          Copy-Item artifacts/ci-package.zip "artifacts/downloads/xlduck-$version-windows-x64.zip"
          Copy-Item artifacts/ci-package/agent/xlduck-skill.zip artifacts/downloads/
          Copy-Item 'examples/research-demo/XlDuck Research Demo.xlsx' artifacts/downloads/XlDuck-Research-Demo.xlsx
          Copy-Item artifacts/ci-package/build-info.json artifacts/downloads/
          Get-ChildItem artifacts/downloads -File | Sort-Object Name | ForEach-Object {
            if ($_.Name -cnotmatch '^[A-Za-z0-9._-]+$') { throw 'Release filenames must survive GitHub asset-name normalization.' }
            "$((Get-FileHash -LiteralPath $_.FullName).Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content artifacts/downloads/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-release
          path: artifacts/downloads/
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: core-and-preview
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-release
          path: downloads
      - name: Check release provenance
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          if ($version -cnotmatch '^\d+\.\d+\.\d+(-preview\.\d+)?$') { throw 'Only stable or numbered preview versions can be published.' }
          if ($env:GITHUB_REF_NAME -cne "v$version") { throw 'Tag and package version differ.' }
          $build = Get-Content downloads/build-info.json -Raw | ConvertFrom-Json
          if ($build.sourceCommit -cne $env:GITHUB_SHA -or $build.trackedChanges -or $build.untrackedFilesPresent) { throw 'Release must come from the clean tagged commit.' }
          Push-Location downloads
          sha256sum --check SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'Download checksum verification failed.' }
          Pop-Location
      - name: Publish the verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          options=(--verify-tag --title "XlDuck ${RELEASE_TAG#v}" --notes-file docs/RELEASE-NOTES.md)
          if [[ "$RELEASE_TAG" == *-preview.* ]]; then
            options+=(--prerelease --latest=false)
          else
            options+=(--latest)
          fi
          gh release create "$RELEASE_TAG" downloads/* "${options[@]}"
