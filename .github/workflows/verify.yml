name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core-and-preview:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      DOTNET_ROLL_FORWARD: LatestMajor
      XLDUCK_TEST_BROWSER: chromium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '11.25.0'
      - name: Acquire verified build dependencies
        shell: powershell
        run: |
          ./scripts/Get-ReaderExtensions.ps1
          ./scripts/Get-PreviewAssets.ps1
      - name: Core, host, engine, worker and read policy
        shell: powershell
        run: ./tests/Run-CoreTests.ps1 -WithReaders
      - name: Install browser test dependencies
        working-directory: tests/preview
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec playwright install chromium
      - name: Preview correctness and offline charts
        run: node tests/preview/preview.test.cjs
      - name: Build an unsigned candidate and check its manifest
        shell: powershell
        run: |
          ./scripts/Build-Package.ps1 -Destination artifacts/ci-package
          ./scripts/Verify-Package.ps1 -Directory artifacts/ci-package
      # Excel and live AWS/SSO checks require their separate owned-machine workflows.
